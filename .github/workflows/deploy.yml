# Test, then deploy to the live cPanel server.
# Runs on every push to main (including the daily SEO routine's pushes).
# Nothing is deployed unless all three test suites pass.
#
# Repository secrets needed: SSH_HOST, SSH_PORT, SSH_USER, SSH_PASS
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30 # recent history for the WhatsApp update message

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: App environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build frontend
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

      - name: Feature tests (PHPUnit)
        run: php artisan test

      - name: Browser tests (Playwright)
        run: |
          npx playwright install --with-deps chrome
          npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

      - name: Package release
        run: |
          rm .env
          tar -czf /tmp/release.tgz --exclude=./node_modules --exclude=./vendor --exclude=./.env \
            --exclude=./.git --exclude='./database/*.sqlite*' --exclude=./test-results --exclude=./playwright-report --exclude=./public/hot \
            --exclude='./storage/logs/*.log' --exclude='./storage/framework/views/*.php' \
            --exclude='./bootstrap/cache/*.php' .

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          # Line 1: SMTP password, line 2: OpenPageRank API key (written only to the server .env).
          SSH_STDIN: |
            ${{ secrets.MAIL_PASSWORD }}
            ${{ secrets.OPENPAGERANK_API_KEY }}
        run: |
          node scripts/cpanel/ssh-put.cjs /tmp/release.tgz release.tgz \
            scripts/cpanel/deploy.sh deploy.sh \
            scripts/cpanel/index.public_html.php index.public_html.php
          node scripts/cpanel/ssh-run.cjs 'bash ~/deploy.sh'

      - name: Smoke test live site
        run: |
          sleep 60
          # Each page gets 3 tries: the shared host sometimes stalls for a few seconds.
          for p in / /word-counter /fr/merge-pdf /sitemap.xml; do
            for try in 1 2 3; do
              code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "https://ilovemytools.store$p")
              echo "$p $code (try $try)"
              [ "$code" = "200" ] && break
              sleep 15
            done
            [ "$code" = "200" ] || exit 1
          done

      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs

      - name: Refill the page cache
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/warm-cache.mjs

      - name: Tell the owner on their phone
        continue-on-error: true
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          WA_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WA_KEY: ${{ secrets.WHATSAPP_APIKEY }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/notify-whatsapp.mjs
